<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>派車</title>
  <style>
    :root { --main: #06c755; --text: #222; --muted: #777; --bg: #f5f5f5; --line: #ddd; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font-family: -apple-system, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); }
    .card { background: #fff; border-radius: 12px; padding: 20px; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .who { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    label, .label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; color: var(--text); }
    .range { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 16px 0 8px; }
    .bar .label { margin: 0; }
    .link { border: 0; background: none; color: var(--main); font-size: 15px; padding: 4px; white-space: nowrap; }
    .order { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; font-weight: 400; }
    .order.on { border-color: var(--main); background: #f3fbf6; }
    .order input { width: 24px; height: 24px; margin: 0; flex: none; }
    .title { font-weight: 600; }
    .sub { font-size: 14px; color: var(--muted); }
    .lines { font-size: 15px; white-space: pre-line; margin-top: 4px; }
    .hint { font-size: 14px; color: var(--muted); margin-top: 6px; }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    .submit { width: 100%; margin-top: 16px; padding: 14px; font-size: 17px; border: 0; border-radius: 8px; background: var(--main); color: #fff; }
    .submit:disabled { background: #aaa; }
    .msg { margin-top: 14px; text-align: center; white-space: pre-line; }
    .err { color: #d00; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚛 派車</h1>
    <div class="who" id="who">載入中…</div>

    <div class="label">出貨日期區間</div>
    <div class="range">
      <input type="date" id="from"><span>～</span><input type="date" id="to">
    </div>

    <label for="date">派車日期（交給司機的日子）</label>
    <input type="date" id="date">

    <div class="bar">
      <div class="label" id="count">親送訂單</div>
      <button type="button" class="link" id="all">全選</button>
    </div>
    <div class="hint">只列出「親送」、還沒派過車的訂單</div>
    <div id="list" style="margin-top:10px"><div class="empty">載入中…</div></div>

    <button type="button" class="submit" id="btn" disabled>確認派車</button>
    <div class="msg" id="msg"></div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="progress.js"></script>
  <script>
    const LIFF_ID = '2011822642-ulMcTzMV';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxspHUq2ruPSPPXkJXkQ_ZsnnD9CkkooMnOlRtZFAT8z8GVLd2pshOhephVznND1s3YZQ/exec';

    const $ = (id) => document.getElementById(id);
    let groupId = '';
    let ORDERS = [];
    const submitId = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2));

    function showMsg(text, isErr) {
      $('msg').textContent = text;
      $('msg').className = 'msg' + (isErr ? ' err' : '');
    }

    const ymd = (offset) => { const d = new Date(); d.setDate(d.getDate() + offset); return d.toLocaleDateString('sv-SE'); };
    const wd = (v) => { const p = v.split(/[-\/]/).map(Number); return '日一二三四五六'[new Date(p[0], p[1] - 1, p[2]).getDay()]; };
    const rowLine = (r) => '・' + (r.grade || '（缺等級）') + '　' + (r.pack || '（缺包裝）') + ' × ' + r.qty;

    function render() {
      const list = $('list');
      list.innerHTML = '';
      $('count').textContent = '親送訂單（共 ' + ORDERS.length + ' 張）';
      if (!ORDERS.length) { list.innerHTML = '<div class="empty">這段期間沒有還沒派車的親送訂單</div>'; updateBtn(); return; }
      ORDERS.forEach((o) => {
        const card = document.createElement('label');
        card.className = 'order';
        card.dataset.id = o.id;
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.className = 'pick';
        cb.onchange = () => { card.classList.toggle('on', cb.checked); updateBtn(); };
        const body = document.createElement('div');
        const title = document.createElement('div'); title.className = 'title';
        title.textContent = o.no + ' ' + o.customer;
        const sub = document.createElement('div'); sub.className = 'sub';
        sub.textContent = ['出貨 ' + o.shipDate.slice(5) + '(' + wd(o.shipDate) + ')', o.by ? '登記：' + o.by : '', o.item ? '備註：' + o.item : '']
          .filter((x) => x).join('｜');
        const lines = document.createElement('div'); lines.className = 'lines';
        lines.textContent = (o.shipped ? o.shipped.rows : o.rows).map(rowLine).join('\n');
        body.append(title, sub, lines);
        card.append(cb, body);
        list.append(card);
      });
      updateBtn();
    }

    const picked = () => [...document.querySelectorAll('.order')].filter((c) => c.querySelector('.pick').checked);

    function updateBtn() {
      const n = picked().length;
      $('btn').textContent = n ? '確認派車（' + n + ' 張）' : '確認派車';
      $('btn').disabled = !n;
    }

    $('all').onclick = () => {
      document.querySelectorAll('.order').forEach((c) => { c.querySelector('.pick').checked = true; c.classList.add('on'); });
      updateBtn();
    };

    async function loadList() {
      if (!$('from').value || !$('to').value) return;
      if ($('from').value > $('to').value) { showMsg('出貨日期區間的開始不能晚於結束', true); return; }
      showMsg('');
      $('list').innerHTML = '<div class="empty">載入中…</div>';
      $('btn').disabled = true;
      const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type: 'dispatch_list', idToken: liff.getIDToken(), groupId: groupId,
          from: $('from').value.replace(/-/g, '/'), to: $('to').value.replace(/-/g, '/') }) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '未知錯誤');
      ORDERS = data.orders;
      render();
    }
    ['from', 'to'].forEach((id) => $(id).addEventListener('change', () => loadList().catch((e) => showMsg('讀取失敗：' + e.message, true))));

    // ---- 電腦版：複製派車編號 ----
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.append(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove(); return ok;
      }
    }

    async function showCopyFallback(text) {
      const head = '✅ 已派車（請勿重新送出）\n群組通知沒發出，電腦端請在群組貼上：' + text;
      const done = () => {
        showMsg(head + '\n（已自動複製，到群組按 Ctrl + V、Enter 即可）\n貼好後可以自己關掉這個視窗');
      };
      if (await copyText(text)) return done();
      showMsg(head);
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'submit'; btn.textContent = '📋 複製「' + text + '」';
      btn.onclick = async () => { if (await copyText(text)) { btn.remove(); done(); } else btn.textContent = '複製失敗，請手動在群組輸入：' + text; };
      $('msg').after(btn);
    }

    function idTokenExpiresSoon(minutes) {
      const t = liff.getDecodedIDToken();
      return !t || !t.exp || t.exp * 1000 < Date.now() + minutes * 60000;
    }

    async function main() {
      $('from').value = ymd(0);
      $('to').value = ymd(3);
      $('date').value = ymd(0);
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

      let relogged = false;
      try { relogged = sessionStorage.getItem('relogin') === '1'; } catch (e) {}
      if (idTokenExpiresSoon(30) && !relogged) {
        try { sessionStorage.setItem('relogin', '1'); } catch (e) {}
        showMsg('登入憑證更新中…');
        liff.logout();
        liff.login({ redirectUri: location.href });
        return;
      }
      try { sessionStorage.removeItem('relogin'); } catch (e) {}

      groupId = new URLSearchParams(location.search).get('gid') || '';
      if (!groupId) { showMsg('請在群組打「派車」，從機器人貼出的連結開啟本表單', true); return; }

      try {
        const perm = await liff.permission.query('chat_message.write');
        if (perm.state === 'prompt') {
          showMsg('請先按「許可」，允許傳送訊息到聊天室…');
          await liff.permission.requestAll();
          return;
        }
      } catch (e) { showMsg(''); }

      const profile = await liff.getProfile();
      $('who').textContent = '派車人：' + profile.displayName;
      await loadList();
    }

    $('btn').addEventListener('click', async () => {
      if (idTokenExpiresSoon(1)) {
        showMsg('表單開太久，登入已過期。請按右上角 ⋮ →「重新整理」後再填一次（還沒送出）', true);
        return;
      }
      if (!$('date').value) { showMsg('請選擇派車日期', true); return; }
      const ids = picked().map((c) => Number(c.dataset.id));
      if (!ids.length) return;

      $('btn').disabled = true;
      showMsg('送出中…（偶爾需要 10–30 秒，請勿關閉）');
      const prog = SubmitProgress($('btn'), 'dispatch'); // 送出按鈕變預估進度條
      const body = JSON.stringify({ type: 'dispatch_submit', submitId: submitId, idToken: liff.getIDToken(), groupId: groupId,
        date: $('date').value.replace(/-/g, '/'), orderIds: ids });
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 60000);
      async function postWithRetry() {
        for (let attempt = 0; ; attempt++) {
          try {
            return await fetch(GAS_URL, { method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body });
          } catch (e) {
            if (e.name === 'AbortError' || attempt >= 2) throw e;
            showMsg('網路不穩，自動重試中…（' + (attempt + 1) + '/2）');
            await new Promise((r) => setTimeout(r, 2000));
          }
        }
      }

      try {
        const res = await postWithRetry();
        prog.received();
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '未知錯誤');
        const code = '派車編號 #' + data.code;
        try {
          await liff.sendMessages([{ type: 'text', text: '🚛 我派車了 ' + data.count + ' 張\n（' + code + '）' }]);
        } catch (e) {
          prog.finish('✅ 已送出');
          showCopyFallback(code);
          return;
        }
        showMsg('✅ 已派車！');
        prog.finish();
        setTimeout(() => liff.closeWindow(), 1500);
      } catch (e) {
        const msg = e.name === 'AbortError' || e.name === 'TypeError'
          ? '連線不穩，可能已經送出。請直接再按一次「確認派車」（不會重複）'
          : '送出失敗：' + e.message;
        showMsg(msg, true);
        prog.reset();
        $('btn').disabled = false;
      } finally {
        clearTimeout(timer);
      }
    });

    main().catch((e) => showMsg('初始化失敗：' + e.message, true));
  </script>
</body>
</html>
