<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>改單審核</title>
  <style>
    :root { --main: #06c755; --text: #222; --muted: #777; --bg: #f5f5f5; --line: #ddd; --bad: #d00; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font-family: -apple-system, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); }
    .card { background: #fff; border-radius: 12px; padding: 20px; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .who { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .hint { font-size: 14px; color: var(--muted); margin: 6px 0 12px; }
    .item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .item.ok { border-color: var(--main); background: #f3fbf6; }
    .item.no { border-color: #f3c6c6; background: #fff7f7; }
    .title { font-weight: 600; }
    .sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
    .diff { font-size: 15px; white-space: pre-line; margin-top: 8px; padding: 8px; border-radius: 8px; background: #f7f7f7; }
    .reason { font-size: 14px; margin-top: 6px; }
    .choice { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
    .choice button { padding: 9px 0; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); }
    .choice button.on.approve { background: var(--main); border-color: var(--main); color: #fff; }
    .choice button.on.reject { background: var(--bad); border-color: var(--bad); color: #fff; }
    .choice button.on.skip { background: #eee; }
    textarea { width: 100%; margin-top: 8px; padding: 8px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; min-height: 50px; }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    .submit { width: 100%; margin-top: 8px; padding: 14px; font-size: 17px; border: 0; border-radius: 8px; background: var(--main); color: #fff; }
    .submit:disabled { background: #aaa; }
    .msg { margin-top: 14px; text-align: center; white-space: pre-line; }
    .err { color: var(--bad); }
      ::placeholder { color: #aaa; opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📋 改單審核</h1>
    <div class="who" id="who">載入中…</div>
    <div class="hint">每筆選「核准」或「駁回」，不想現在處理的選「略過」。駁回要寫原因。核准後會馬上套用到訂單。</div>
    <div id="list"><div class="empty">載入中…</div></div>
    <button type="button" class="submit" id="btn" disabled>送出審核</button>
    <div class="msg" id="msg"></div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="progress.js"></script>
  <script>
    const LIFF_ID = '2011822642-ulMcTzMV';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxspHUq2ruPSPPXkJXkQ_ZsnnD9CkkooMnOlRtZFAT8z8GVLd2pshOhephVznND1s3YZQ/exec';

    const $ = (id) => document.getElementById(id);
    let groupId = '';
    let ITEMS = [];
    const choice = {}; // { crId: 'approve' | 'reject' | 'skip' }
    const submitId = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2));

    function showMsg(text, isErr) {
      $('msg').textContent = text;
      $('msg').className = 'msg' + (isErr ? ' err' : '');
    }

    function render() {
      const list = $('list');
      list.innerHTML = '';
      if (!ITEMS.length) { list.innerHTML = '<div class="empty">目前沒有待處理的改單申請 🎉</div>'; updateBtn(); return; }
      ITEMS.forEach((c) => {
        choice[c.id] = choice[c.id] || 'skip';
        const box = document.createElement('div'); box.className = 'item'; box.dataset.id = c.id;
        const title = document.createElement('div'); title.className = 'title';
        title.textContent = c.orderNo + '｜' + c.type;
        const sub = document.createElement('div'); sub.className = 'sub';
        sub.textContent = c.no + '｜' + c.applicant + '｜' + String(c.date).slice(5) + ' 申請';
        const diff = document.createElement('div'); diff.className = 'diff'; diff.textContent = c.diff;
        const reason = document.createElement('div'); reason.className = 'reason'; reason.textContent = '原因：' + c.reason;
        const row = document.createElement('div'); row.className = 'choice';
        const note = document.createElement('textarea'); note.className = 'note'; note.placeholder = '說明（駁回必填），例：已經出貨了，不能改';
        [['approve', '👍 核准'], ['reject', '❌ 駁回'], ['skip', '略過']].forEach(([v, label]) => {
          const b = document.createElement('button'); b.type = 'button'; b.className = v; b.textContent = label;
          b.onclick = () => {
            choice[c.id] = v;
            row.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
            box.className = 'item' + (v === 'approve' ? ' ok' : v === 'reject' ? ' no' : '');
            updateBtn();
          };
          if (choice[c.id] === v) b.classList.add('on');
          row.append(b);
        });
        box.append(title, sub, diff, reason, row, note);
        list.append(box);
      });
      updateBtn();
    }

    function updateBtn() {
      const n = Object.keys(choice).filter((k) => choice[k] !== 'skip').length;
      $('btn').textContent = n ? '送出審核（' + n + ' 筆）' : '送出審核';
      $('btn').disabled = !n;
    }

    // ---- 電腦版：複製審核編號 ----
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.append(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove(); return ok;
      }
    }

    async function showCopyFallback(text) {
      const head = '✅ 已送出審核（請勿重新送出）\n群組通知沒發出，電腦端請在群組貼上：' + text;
      const done = () => showMsg(head + '\n（已自動複製，到群組按 Ctrl + V、Enter 即可）\n貼好後可以自己關掉這個視窗');
      if (await copyText(text)) return done();
      showMsg(head);
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'submit'; btn.textContent = '📋 複製「' + text + '」';
      btn.onclick = async () => { if (await copyText(text)) { btn.remove(); done(); } else btn.textContent = '複製失敗，請手動在群組輸入：' + text; };
      $('msg').after(btn);
    }

    function idTokenExpiresSoon(minutes) {
      const t = liff.getDecodedIDToken();
      return !t || !t.exp || t.exp * 1000 < Date.now() + minutes * 60000;
    }

    async function main() {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

      let relogged = false;
      try { relogged = sessionStorage.getItem('relogin') === '1'; } catch (e) {}
      if (idTokenExpiresSoon(30) && !relogged) {
        try { sessionStorage.setItem('relogin', '1'); } catch (e) {}
        showMsg('登入憑證更新中…');
        liff.logout();
        liff.login({ redirectUri: location.href });
        return;
      }
      try { sessionStorage.removeItem('relogin'); } catch (e) {}

      groupId = new URLSearchParams(location.search).get('gid') || '';
      if (!groupId) { showMsg('請在行政群組打「改單審核」，從機器人貼出的連結開啟', true); return; }

      try {
        const perm = await liff.permission.query('chat_message.write');
        if (perm.state === 'prompt') {
          showMsg('請先按「許可」，允許傳送訊息到聊天室…');
          await liff.permission.requestAll();
          return;
        }
      } catch (e) { showMsg(''); }

      const profile = await liff.getProfile();
      $('who').textContent = '審核人：' + profile.displayName;
      const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type: 'approve_list', idToken: liff.getIDToken(), groupId: groupId }) });
      const data = JSON.parse(await res.text());
      if (!data.ok) throw new Error(data.error || '未知錯誤');
      ITEMS = data.items;
      render();
    }

    $('btn').addEventListener('click', async () => {
      if (idTokenExpiresSoon(1)) {
        showMsg('表單開太久，登入已過期。請按右上角 ⋮ →「重新整理」後再審一次（還沒送出）', true);
        return;
      }
      const items = [];
      for (const box of document.querySelectorAll('.item')) {
        const id = box.dataset.id;
        if (choice[id] === 'skip') continue;
        const note = box.querySelector('.note').value.trim();
        if (choice[id] === 'reject' && !note) { showMsg('駁回要寫原因（' + box.querySelector('.title').textContent + '）', true); box.querySelector('.note').focus(); return; }
        items.push({ crId: Number(id), action: choice[id], note: note });
      }
      if (!items.length) return;

      showMsg('送出中…（核准會馬上套用到訂單，請勿關閉）');
      const prog = SubmitProgress($('btn'), 'approve'); // 送出按鈕變預估進度條
      const body = JSON.stringify({ type: 'approve_submit', submitId: submitId, idToken: liff.getIDToken(), groupId: groupId, items: items });
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 90000);
      async function postWithRetry() {
        for (let attempt = 0; ; attempt++) {
          try {
            return await fetch(GAS_URL, { method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body });
          } catch (e) {
            if (e.name === 'AbortError' || attempt >= 2) throw e;
            showMsg('網路不穩，自動重試中…（' + (attempt + 1) + '/2）');
            await new Promise((r) => setTimeout(r, 2000));
          }
        }
      }

      try {
        const res = await postWithRetry();
        prog.received();
        const data = JSON.parse(await res.text());
        if (!data.ok) throw new Error(data.error || '未知錯誤');
        const code = '審核編號 #' + data.ids;
        try {
          await liff.sendMessages([{ type: 'text', text: '📋 我審核了 ' + data.count + ' 筆改單\n（' + code + '）' }]);
        } catch (e) {
          prog.finish('✅ 已送出');
          showCopyFallback(code);
          return;
        }
        showMsg('✅ 已送出審核！');
        prog.finish();
        setTimeout(() => liff.closeWindow(), 1500);
      } catch (e) {
        const msg = e.name === 'AbortError' || e.name === 'TypeError'
          ? '連線不穩，可能已經送出。請直接再按一次「送出審核」（不會重複）'
          : '送出失敗：' + e.message;
        showMsg(msg, true);
        prog.reset();
        $('btn').disabled = false;
      } finally {
        clearTimeout(timer);
      }
    });

    main().catch((e) => showMsg('初始化失敗：' + e.message, true));
  </script>
</body>
</html>
