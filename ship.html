<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>包裝清單</title>
  <style>
    :root { --main: #06c755; --text: #222; --muted: #777; --bg: #f5f5f5; --line: #ddd; --warn: #b45309; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font-family: -apple-system, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); }
    .card { background: #fff; border-radius: 12px; padding: 20px; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .who { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    label, .label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input, textarea, select { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; color: var(--text); }
    textarea { min-height: 60px; }
    .bar { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 8px; }
    .bar .label { margin: 0; }
    .bar { gap: 8px; }
    .link { border: 0; background: none; color: var(--main); font-size: 15px; padding: 4px; white-space: nowrap; }
    .order { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .order.on { border-color: var(--main); background: #f3fbf6; }
    .head { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; }
    .head input { width: 24px; height: 24px; margin: 0; flex: none; }
    .sub { font-size: 14px; color: var(--muted); font-weight: 400; }
    .lines { margin: 6px 0 0 34px; font-size: 15px; white-space: pre-line; }
    .done { margin: 6px 0 0 34px; font-size: 14px; color: var(--main); white-space: pre-line; }
    .swap { margin: 8px 0 0 34px; border: 1px dashed var(--warn); border-radius: 8px; background: #fff; color: var(--warn); font-size: 14px; padding: 6px 10px; }
    .edit { margin: 8px 0 0 0; padding: 10px; border-radius: 8px; background: #fffaf0; }
    .edit .hint { margin: 0 0 8px; }
    .row { display: grid; grid-template-columns: 1fr 80px 40px; grid-template-areas: "grade qty del" "pack pack pack";
           gap: 8px; padding: 8px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .row .grade { grid-area: grade; }
    .row .pack { grid-area: pack; }
    .row input { grid-area: qty; text-align: center; }
    .del { grid-area: del; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #c00; font-size: 18px; }
    .add { width: 100%; padding: 8px; border: 1px dashed var(--main); border-radius: 8px; background: #fff; color: var(--main); font-size: 15px; }
    .hint { font-size: 14px; color: var(--muted); margin-top: 6px; }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    .submit { width: 100%; margin-top: 16px; padding: 14px; font-size: 17px; border: 0; border-radius: 8px; background: var(--main); color: #fff; }
    .submit:disabled { background: #aaa; }
    .msg { margin-top: 14px; text-align: center; white-space: pre-line; }
    .err { color: #d00; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚚 包裝清單</h1>
    <div class="who" id="who">載入中…</div>

    <label for="date">出貨日期</label>
    <input type="date" id="date">

    <div class="bar">
      <div class="label" id="count">訂單</div>
      <button type="button" class="link" id="all">全選未出貨</button>
    </div>
    <div class="hint">勾選已出貨的訂單。照訂單出直接勾；有替換（例：良蛋不夠改出大蛋）按「有替換」修改</div>
    <div id="list" style="margin-top:10px"><div class="empty">載入中…</div></div>

    <button type="button" class="submit" id="btn" disabled>確認出貨</button>
    <div class="msg" id="msg"></div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="progress.js"></script>
  <script>
    const LIFF_ID = '2011822642-ulMcTzMV';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxspHUq2ruPSPPXkJXkQ_ZsnnD9CkkooMnOlRtZFAT8z8GVLd2pshOhephVznND1s3YZQ/exec';

    const $ = (id) => document.getElementById(id);
    let groupId = '';
    let ORDERS = [];
    let OPTS = { orderGrades: [], grades: [], packs: [] };
    const submitId = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2));

    function showMsg(text, isErr) {
      $('msg').textContent = text;
      $('msg').className = 'msg' + (isErr ? ' err' : '');
    }

    function fillSelect(s, placeholder, options, value) {
      s.innerHTML = '';
      s.append(new Option(placeholder, ''));
      const list = options.slice();
      if (value && list.indexOf(value) < 0) list.push(value);
      list.forEach((o) => s.append(new Option(o, o)));
      s.value = value || '';
    }

    const rowLine = (r) => '・' + (r.grade || '（缺等級）') + '　' + (r.pack || '（缺包裝）') + ' × ' + r.qty;
    // 舊訂單等級可能是空白：訂單明細缺東西就不能直接照單出，要按「有替換」補
    const incomplete = (rows) => !rows.length || rows.some((r) => !r.grade || !r.pack || !(Number(r.qty) > 0));
    // 跟訂單一樣嗎？訂單缺等級的列只比包裝＋數量（補上等級不算替換）
    function sameAsOrder(rows, ordered) {
      if (rows.length !== ordered.length) return false;
      const left = rows.slice();
      return ordered.slice().sort((a, b) => (a.grade ? 0 : 1) - (b.grade ? 0 : 1)).every((o) => {
        const i = left.findIndex((r) => r.pack === o.pack && Number(r.qty) === Number(o.qty) && (!o.grade || r.grade === o.grade));
        if (i < 0) return false;
        left.splice(i, 1);
        return true;
      });
    }

    function addRow(box, r) {
      r = r || { grade: '', pack: '', qty: '' };
      const row = document.createElement('div');
      row.className = 'row';
      const grade = document.createElement('select'); grade.className = 'grade';
      fillSelect(grade, '等級', OPTS.orderGrades && OPTS.orderGrades.length ? OPTS.orderGrades : OPTS.grades, r.grade);
      const pack = document.createElement('select'); pack.className = 'pack';
      fillSelect(pack, '包裝方式', OPTS.packs || [], r.pack);
      const qty = document.createElement('input');
      qty.type = 'number'; qty.inputMode = 'numeric'; qty.min = '1'; qty.step = '1'; qty.placeholder = '數量';
      qty.value = r.qty || '';
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'del'; del.textContent = '✕';
      del.onclick = () => { if (box.children.length > 1) row.remove(); };
      row.append(grade, qty, del, pack);
      box.append(row);
    }

    function readRows(box) {
      return [...box.children].map((row) => ({
        grade: row.querySelector('.grade').value,
        pack: row.querySelector('.pack').value,
        qty: row.querySelector('input').value,
      })).filter((r) => r.grade || r.pack || r.qty);
    }

    function render() {
      const list = $('list');
      list.innerHTML = '';
      const done = ORDERS.filter((o) => o.shipped).length;
      $('count').textContent = '訂單（共 ' + ORDERS.length + ' 張' + (done ? '，已出 ' + done + ' 張' : '') + '）';
      if (!ORDERS.length) { list.innerHTML = '<div class="empty">這天沒有要出貨的訂單</div>'; updateBtn(); return; }
      ORDERS.forEach((o) => {
        const card = document.createElement('div');
        card.className = 'order';
        card.dataset.id = o.id;

        const head = document.createElement('label');
        head.className = 'head';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.className = 'pick';
        cb.onchange = () => {
          card.classList.toggle('on', cb.checked);
          // 訂單明細缺等級／包裝：勾了就直接打開修改區，讓人補上
          if (cb.checked && !o.shipped && incomplete(o.rows) && edit.classList.contains('hidden')) swap.onclick();
          updateBtn();
        };
        const title = document.createElement('div');
        title.innerHTML = '';
        title.append(o.no + ' ' + o.customer);
        const sub = document.createElement('div'); sub.className = 'sub';
        sub.textContent = [o.method, o.by ? '登記：' + o.by : '', o.item ? '備註：' + o.item : ''].filter((x) => x).join('｜');
        title.append(sub);
        head.append(cb, title);
        card.append(head);

        const lines = document.createElement('div'); lines.className = 'lines';
        lines.textContent = o.rows.map(rowLine).join('\n');
        card.append(lines);
        if (!o.shipped && incomplete(o.rows)) {
          const w = document.createElement('div'); w.className = 'done'; w.style.color = 'var(--warn)';
          w.textContent = '⚠️ 訂單明細缺等級或包裝，勾選後請補上實際出貨的內容';
          card.append(w);
        }

        if (o.shipped) {
          const d = document.createElement('div'); d.className = 'done';
          const changed = !sameAsOrder(o.shipped.rows, o.rows);
          d.textContent = '✅ 已出貨（' + o.shipped.by + ' ' + String(o.shipped.at).slice(5) + '）'
            + (changed ? '\n實際出：\n' + o.shipped.rows.map(rowLine).join('\n') + '\n替換原因：' + o.shipped.reason : '')
            + '\n要修改請勾選後按「有替換」';
          card.append(d);
        }

        const swap = document.createElement('button');
        swap.type = 'button'; swap.className = 'swap'; swap.textContent = '🔄 有替換';
        const edit = document.createElement('div'); edit.className = 'edit hidden';
        const hint = document.createElement('div'); hint.className = 'hint'; hint.textContent = '改成實際出貨的內容：';
        const box = document.createElement('div'); box.className = 'rowsBox';
        const add = document.createElement('button'); add.type = 'button'; add.className = 'add'; add.textContent = '＋ 新增一列';
        add.onclick = () => addRow(box);
        const rl = document.createElement('label'); rl.textContent = '替換原因（有替換必填）'; rl.style.marginTop = '10px';
        const reason = document.createElement('textarea'); reason.className = 'reason'; reason.placeholder = '例如：良蛋不夠，用大蛋補';
        edit.append(hint, box, add, rl, reason);
        swap.onclick = () => {
          if (!edit.classList.contains('hidden')) return;
          box.innerHTML = '';
          ((o.shipped ? o.shipped.rows : o.rows).length ? (o.shipped ? o.shipped.rows : o.rows) : [null]).forEach((r) => addRow(box, r));
          reason.value = o.shipped ? o.shipped.reason : '';
          edit.classList.remove('hidden');
          swap.classList.add('hidden');
          cb.checked = true; card.classList.add('on'); updateBtn();
        };
        card.append(swap, edit);
        list.append(card);
      });
      updateBtn();
    }

    function picked() {
      return [...document.querySelectorAll('.order')].filter((c) => c.querySelector('.pick').checked);
    }

    function updateBtn() {
      const n = picked().length;
      $('btn').textContent = n ? '確認出貨（' + n + ' 張）' : '確認出貨';
      $('btn').disabled = !n;
    }

    $('all').onclick = () => {
      document.querySelectorAll('.order').forEach((c) => {
        const o = ORDERS.find((x) => String(x.id) === c.dataset.id);
        if (o && !o.shipped && !c.querySelector('.pick').checked) { c.querySelector('.pick').checked = true; c.querySelector('.pick').onchange(); }
      });
      updateBtn();
    };

    async function post(body) {
      const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '未知錯誤');
      return data;
    }

    async function loadList(withOptions) {
      $('list').innerHTML = '<div class="empty">載入中…</div>';
      $('btn').disabled = true;
      const data = await post({ type: 'ship_list', idToken: liff.getIDToken(), groupId: groupId,
        date: $('date').value.replace(/-/g, '/'), withOptions: withOptions });
      if (data.options) OPTS = data.options;
      $('date').value = data.date.replace(/\//g, '-');
      ORDERS = data.orders;
      render();
    }

    $('date').addEventListener('change', () => {
      if (!$('date').value) return;
      showMsg('');
      loadList(false).catch((e) => showMsg('讀取失敗：' + e.message, true));
    });

    // ---- 電腦版：複製出貨編號 ----
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.append(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove(); return ok;
      }
    }

    async function showCopyFallback(text) {
      const head = '✅ 已確認出貨（請勿重新送出）\n群組通知沒發出，電腦端請在群組貼上：' + text;
      const done = () => {
        showMsg(head + '\n（已自動複製，到群組按 Ctrl + V、Enter 即可）\n貼好後可以自己關掉這個視窗');
      };
      if (await copyText(text)) return done();
      showMsg(head);
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'submit'; btn.textContent = '📋 複製「' + text + '」';
      btn.onclick = async () => { if (await copyText(text)) { btn.remove(); done(); } else btn.textContent = '複製失敗，請手動在群組輸入：' + text; };
      $('msg').after(btn);
    }

    function idTokenExpiresSoon(minutes) {
      const t = liff.getDecodedIDToken();
      return !t || !t.exp || t.exp * 1000 < Date.now() + minutes * 60000;
    }

    async function main() {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

      let relogged = false;
      try { relogged = sessionStorage.getItem('relogin') === '1'; } catch (e) {}
      if (idTokenExpiresSoon(30) && !relogged) {
        try { sessionStorage.setItem('relogin', '1'); } catch (e) {}
        showMsg('登入憑證更新中…');
        liff.logout();
        liff.login({ redirectUri: location.href });
        return;
      }
      try { sessionStorage.removeItem('relogin'); } catch (e) {}

      groupId = new URLSearchParams(location.search).get('gid') || '';
      if (!groupId) { showMsg('請在群組打「包裝」，從機器人貼出的連結開啟本表單', true); return; }

      try {
        const perm = await liff.permission.query('chat_message.write');
        if (perm.state === 'prompt') {
          showMsg('請先按「許可」，允許傳送訊息到聊天室…');
          await liff.permission.requestAll();
          return;
        }
      } catch (e) { showMsg(''); }

      const profile = await liff.getProfile();
      $('who').textContent = '確認人：' + profile.displayName;
      // 從「包裝 明天」這類清單點進來：直接打開那一天
      const d = new URLSearchParams(location.search).get('d') || '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(d)) $('date').value = d;
      await loadList(true);
    }

    $('btn').addEventListener('click', async () => {
      if (idTokenExpiresSoon(1)) {
        showMsg('表單開太久，登入已過期。請按右上角 ⋮ →「重新整理」後再填一次（還沒送出）', true);
        return;
      }
      const items = [];
      for (const card of picked()) {
        const o = ORDERS.find((x) => String(x.id) === card.dataset.id);
        const edit = card.querySelector('.edit');
        let rows = o.rows;
        let reason = '';
        if (!edit.classList.contains('hidden')) {
          rows = readRows(card.querySelector('.rowsBox'));
          reason = card.querySelector('.reason').value.trim();
          if (!rows.length || rows.some((r) => !r.grade || !r.pack || !(Number(r.qty) > 0))) {
            showMsg(o.no + '：實際出貨每一列都要選等級、包裝方式、填數量', true); return;
          }
          if (!sameAsOrder(rows, o.rows) && !reason) { showMsg(o.no + '：有替換，請填替換原因', true); return; }
        } else if (incomplete(rows)) {
          card.querySelector('.swap').onclick();
          showMsg(o.no + '：訂單明細缺等級或包裝，請在下方補上實際出貨的內容', true); return;
        }
        items.push({ orderId: o.id, rows: rows.map((r) => ({ grade: r.grade, pack: r.pack, qty: String(r.qty) })), reason: reason });
      }
      if (!items.length) return;

      $('btn').disabled = true;
      showMsg('送出中…（偶爾需要 10–30 秒，請勿關閉）');
      const prog = SubmitProgress($('btn'), 'ship'); // 送出按鈕變預估進度條
      const body = JSON.stringify({ type: 'ship_submit', submitId: submitId, idToken: liff.getIDToken(), groupId: groupId, items: items });
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 60000);
      async function postWithRetry() {
        for (let attempt = 0; ; attempt++) {
          try {
            return await fetch(GAS_URL, { method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body });
          } catch (e) {
            if (e.name === 'AbortError' || attempt >= 2) throw e;
            showMsg('網路不穩，自動重試中…（' + (attempt + 1) + '/2）');
            await new Promise((r) => setTimeout(r, 2000));
          }
        }
      }

      try {
        const res = await postWithRetry();
        prog.received();
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '未知錯誤');
        const code = '出貨編號 #' + data.ids;
        try {
          await liff.sendMessages([{ type: 'text', text: '🚚 我確認出貨了 ' + data.count + ' 張\n（' + code + '）' }]);
        } catch (e) {
          prog.finish('✅ 已送出');
          showCopyFallback(code);
          return;
        }
        showMsg('✅ 已確認出貨！');
        prog.finish();
        setTimeout(() => liff.closeWindow(), 1500);
      } catch (e) {
        const msg = e.name === 'AbortError' || e.name === 'TypeError'
          ? '連線不穩，可能已經送出。請直接再按一次「確認出貨」（不會重複）'
          : '送出失敗：' + e.message;
        showMsg(msg, true);
        prog.reset();
        $('btn').disabled = false;
      } finally {
        clearTimeout(timer);
      }
    });

    main().catch((e) => showMsg('初始化失敗：' + e.message, true));
  </script>
</body>
</html>
