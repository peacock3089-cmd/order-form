<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>訂單登記</title>
  <style>
    :root { --main: #06c755; --text: #222; --muted: #777; --bg: #f5f5f5; --line: #ddd; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font-family: -apple-system, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); }
    .card { background: #fff; border-radius: 12px; padding: 20px; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .who { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    label, .label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input, textarea, select { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; color: var(--text); }
    textarea { min-height: 80px; }
    /* 每列兩行：等級｜數量｜✕ ／ 包裝方式（整行），手機上選項文字才不會被截斷 */
    .row { display: grid; grid-template-columns: 1fr 90px 40px; grid-template-areas: "grade qty del" "pack pack pack";
           gap: 8px; padding: 10px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 10px; }
    .row .grade { grid-area: grade; }
    .row .pack { grid-area: pack; }
    .row input { grid-area: qty; text-align: center; }
    .del { grid-area: del; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #c00; font-size: 18px; }
    .add { width: 100%; padding: 10px; border: 1px dashed var(--main); border-radius: 8px; background: #fff; color: var(--main); font-size: 16px; }
    .submit { width: 100%; margin-top: 24px; padding: 14px; font-size: 17px; border: 0; border-radius: 8px; background: var(--main); color: #fff; }
    .submit:disabled { background: #aaa; }
    /* 通知（tag）下拉多選 */
    .tagbox { position: relative; }
    .tagbtn { width: 100%; padding: 10px; font-size: 16px; text-align: left; border: 1px solid #ccc; border-radius: 8px; background: #fff; color: var(--text); }
    .tagbtn.empty { color: #999; }
    .tagbtn::after { content: '▾'; float: right; color: var(--muted); }
    .taglist { display: none; margin-top: 4px; max-height: 240px; overflow-y: auto; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
    .taglist.open { display: block; }
    .taglist label { display: flex; align-items: center; gap: 10px; margin: 0; padding: 10px 12px; font-weight: normal; border-bottom: 1px solid #eee; }
    .taglist label:last-child { border-bottom: 0; }
    .taglist input { width: 20px; height: 20px; margin: 0; }
    .taghint { padding: 10px 12px; color: var(--muted); font-size: 14px; }
    .advbtn { width: 100%; margin-top: 20px; padding: 10px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; background: #fafafa; color: var(--muted); }
    .adv { display: none; }
    .adv.open { display: block; }
    input[type=file] { padding: 8px; font-size: 15px; }
    .filelist { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .msg { margin-top: 14px; text-align: center; }
    .err { color: #d00; }
  </style>
</head>
<body>
  <div class="card">
    <h1>訂單登記</h1>
    <div class="who" id="who">載入中…</div>

    <form id="form">
      <!-- 欄位順序與機器人回覆格式一致 -->
      <label for="shipDate">出貨日期（週日不出貨）</label>
      <input type="date" id="shipDate" required>

      <label for="shipMethod">出貨方式</label>
      <select id="shipMethod">
        <option value="">（未選）</option>
        <option>自取</option><option>親送</option><option>黑貓</option><option>大榮</option>
      </select>

      <label for="customer">客戶</label>
      <input id="customer" placeholder="客戶名稱" required>

      <div class="label">出貨明細</div>
      <div id="rows"></div>
      <button type="button" class="add" id="addRow">＋ 新增一列</button>

      <label for="payMethod">結帳方式</label>
      <select id="payMethod">
        <option value="">（未選）</option>
        <option>月結</option><option>匯款</option><option>收現</option><option>黑貓貨到付款</option>
      </select>

      <label for="invoice">發票方式</label>
      <select id="invoice">
        <option value="">（未選）</option>
        <option>二聯</option><option>三聯</option>
      </select>

      <label for="item">備註</label>
      <textarea id="item" placeholder="選填"></textarea>

      <!-- 不常用的欄位收在「進階設定」裡，預設摺疊 -->
      <button type="button" class="advbtn" id="advBtn">進階設定 ▾</button>
      <div class="adv" id="adv">
      <label for="amount">匯款金額</label>
      <input type="number" id="amount" inputmode="numeric" min="0" step="1" placeholder="選填">

      <label for="photos">照片上傳</label>
      <input type="file" id="photos" accept="image/*" multiple>
      <div class="filelist" id="photoList"></div>

      <label for="files">檔案上傳</label>
      <input type="file" id="files" multiple>
      <div class="filelist" id="fileList"></div>

      <div class="label">通知（tag）</div>
      <div class="tagbox">
        <button type="button" class="tagbtn empty" id="tagBtn">不通知</button>
        <div class="taglist" id="tagList"><div class="taghint">載入成員中…</div></div>
      </div>
      </div><!-- /adv -->

      <button type="submit" class="submit" id="btn" disabled>送出</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = '2011822642-ulMcTzMV';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxspHUq2ruPSPPXkJXkQ_ZsnnD9CkkooMnOlRtZFAT8z8GVLd2pshOhephVznND1s3YZQ/exec';

    // 下拉選項：表單打開後會從 Ragic 讀最新的（formInit），這裡只是讀取失敗時的備用值
    let GRADES = ['良蛋', '次級蛋', '大蛋', 'NG', '破蛋', '初生蛋']; // 等級＝「目前庫存(校正)」的庫存品項
    let PACKS = ['6入', '10入', '30入'];

    const $ = (id) => document.getElementById(id);
    let groupId = '';
    // 冪等鍵：開一次表單一個 ID，按幾次送出都用同一個，GAS 只會寫入 Ragic 一次
    const submitId = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2));

    function showMsg(text, isErr) {
      $('msg').textContent = text;
      $('msg').className = 'msg' + (isErr ? ' err' : '');
    }

    // 重填下拉選項；原本選的值若還在新清單裡就保留
    function fillSelect(s, placeholder, options) {
      const keep = s.value;
      s.innerHTML = '';
      s.append(new Option(placeholder, ''));
      options.forEach((o) => s.append(new Option(o, o)));
      s.value = options.indexOf(keep) >= 0 ? keep : '';
    }

    function makeSelect(cls, placeholder, options) {
      const s = document.createElement('select');
      s.className = cls;
      s.required = true;
      fillSelect(s, placeholder, options);
      return s;
    }

    // 套用 Ragic 讀回來的最新選項（空清單就沿用備用值）
    function applyOptions(o) {
      if (o.orderGrades && o.orderGrades.length) GRADES = o.orderGrades;
      if (o.packs && o.packs.length) PACKS = o.packs;
      document.querySelectorAll('#rows .grade').forEach((s) => fillSelect(s, '等級', GRADES));
      document.querySelectorAll('#rows .pack').forEach((s) => fillSelect(s, '包裝方式', PACKS));
      [['shipMethod', o.shipMethod], ['payMethod', o.payMethod], ['invoice', o.invoice]].forEach(([id, list]) => {
        if (list && list.length) fillSelect($(id), '（未選）', list);
      });
    }

    function addRow() {
      const row = document.createElement('div');
      row.className = 'row';
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '✕';
      del.onclick = () => { if ($('rows').children.length > 1) row.remove(); };
      const qty = document.createElement('input');
      qty.type = 'number';
      qty.inputMode = 'numeric';
      qty.min = '1';
      qty.step = '1';
      qty.required = true;
      qty.placeholder = '數量';
      row.append(makeSelect('grade', '等級', GRADES), qty, del, makeSelect('pack', '包裝方式', PACKS));
      $('rows').append(row);
    }

    function readRows() {
      return [...$('rows').children].map((row) => {
        return { grade: row.querySelector('.grade').value, pack: row.querySelector('.pack').value, qty: row.querySelector('input').value };
      });
    }

    // ---- 進階設定（匯款金額／照片／檔案／通知）：預設摺疊 ----
    $('advBtn').onclick = () => {
      const open = $('adv').classList.toggle('open');
      $('advBtn').textContent = open ? '進階設定 ▴' : '進階設定 ▾';
    };

    // ---- 通知（tag）：預設空白，點開勾選多人 ----
    $('tagBtn').onclick = () => $('tagList').classList.toggle('open');

    function checkedTags() {
      return [...$('tagList').querySelectorAll('input:checked')];
    }

    function updateTagBtn() {
      const names = checkedTags().map((c) => c.dataset.name);
      $('tagBtn').textContent = names.length ? names.join('、') : '不通知';
      $('tagBtn').classList.toggle('empty', !names.length);
    }

    // 表單打開時跟 GAS 拿一次：最新下拉選項 + 成員名冊（背景載入，不擋表單）
    // 成員只列出在群組講過話、機器人認得的人
    async function loadInit() {
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ type: 'init', idToken: liff.getIDToken(), groupId: groupId }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        if (data.options) applyOptions(data.options);
        $('tagList').innerHTML = '';
        if (!data.members.length) {
          $('tagList').innerHTML = '<div class="taghint">還沒有成員資料（成員在群組講過話後才會出現）</div>';
          return;
        }
        data.members.forEach((m) => {
          const label = document.createElement('label');
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.value = m.uid;
          cb.dataset.name = m.name;
          cb.onchange = updateTagBtn;
          label.append(cb, document.createTextNode(m.name));
          $('tagList').append(label);
        });
      } catch (e) {
        $('tagList').innerHTML = '<div class="taghint">成員載入失敗，這次無法 tag（' + e.message + '）</div>';
      }
    }

    // ---- 照片／檔案 ----
    const MAX_FILE_MB = 10; // 單一檔案上限（GAS 一次收的資料有上限，太大會失敗）

    function showPicked(input, listId) {
      const names = [...input.files].map((f) => f.name + '（' + (f.size / 1048576).toFixed(1) + 'MB）');
      $(listId).textContent = names.length ? '已選 ' + names.length + ' 個：' + names.join('、') : '';
    }
    $('photos').onchange = () => showPicked($('photos'), 'photoList');
    $('files').onchange = () => showPicked($('files'), 'fileList');

    function toBase64(blob) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result).split(',')[1]);
        r.onerror = reject;
        r.readAsDataURL(blob);
      });
    }

    // 照片壓縮：長邊縮到 1600px、JPEG 品質 0.8（約 300KB，單據文字仍清楚）
    function compressImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(img.src);
          c.toBlob((b) => resolve(b || file), 'image/jpeg', 0.8);
        };
        img.onerror = () => resolve(file); // 讀不了（例如特殊格式）就傳原檔
        img.src = URL.createObjectURL(file);
      });
    }

    async function readPhotos() {
      const out = [];
      for (const f of $('photos').files) {
        const b = await compressImage(f);
        const name = b === f ? f.name : f.name.replace(/\.[^.]+$/, '') + '.jpg';
        out.push({ name: name, type: b.type || f.type, data: await toBase64(b) });
      }
      return out;
    }

    async function readFiles() {
      const out = [];
      for (const f of $('files').files) {
        if (f.size > MAX_FILE_MB * 1048576) throw new Error('「' + f.name + '」超過 ' + MAX_FILE_MB + 'MB');
        out.push({ name: f.name, type: f.type, data: await toBase64(f) });
      }
      return out;
    }

    // ---- 電腦版：複製登記編號 ----
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) {
        // 舊方法備援
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.append(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      }
    }

    async function showCopyFallback(text) {
      const head = '✅ 已登記成功（請勿重新送出）\n群組通知沒發出，電腦端請在群組貼上：' + text;
      $('msg').style.whiteSpace = 'pre-line';
      const done = () => {
        showMsg(head + '\n（已自動複製，到群組按 Ctrl + V、Enter 即可）\n5 秒後自動關閉');
        setTimeout(() => liff.closeWindow(), 5000);
      };
      if (await copyText(text)) return done();

      // 自動複製被瀏覽器擋（需要使用者點一下）→ 給一顆複製按鈕
      showMsg(head);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'submit';
      btn.textContent = '📋 複製「' + text + '」';
      btn.onclick = async () => {
        if (await copyText(text)) { btn.remove(); done(); }
        else btn.textContent = '複製失敗，請手動在群組輸入：' + text;
      };
      $('msg').after(btn);
    }

    $('addRow').onclick = addRow;
    addRow();
    // ---- 週日不出貨 ----
    const isSunday = (ymd) => { const p = ymd.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).getDay() === 0; };
    // 預設今天；今天是週日就預設隔天（週一）
    const d0 = new Date();
    if (d0.getDay() === 0) d0.setDate(d0.getDate() + 1);
    $('shipDate').value = d0.toLocaleDateString('sv-SE');
    $('shipDate').addEventListener('change', () => {
      if ($('shipDate').value && isSunday($('shipDate').value)) {
        $('shipDate').value = '';
        showMsg('週日不出貨，請選其他出貨日期', true);
      } else {
        showMsg('');
      }
    });

    function idTokenExpiresSoon(minutes) {
      const t = liff.getDecodedIDToken();
      return !t || !t.exp || t.exp * 1000 < Date.now() + minutes * 60000;
    }

    async function main() {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

      // 電腦版會沿用之前存下的登入憑證，ID token 可能已過期 → GAS 驗證會失敗。
      // 開表單時就檢查，快過期（30 分鐘內）就重新登入一次，避免填完才送不出去
      let relogged = false;
      try { relogged = sessionStorage.getItem('relogin') === '1'; } catch (e) {}
      if (idTokenExpiresSoon(30) && !relogged) { // 只重登一次，避免無限跳轉
        try { sessionStorage.setItem('relogin', '1'); } catch (e) {}
        showMsg('登入憑證更新中…');
        liff.logout();
        liff.login({ redirectUri: location.href });
        return;
      }
      try { sessionStorage.removeItem('relogin'); } catch (e) {}

      // groupId 由機器人在群組貼出的連結帶進來：https://liff.line.me/{LIFF_ID}?gid=Cxxxx
      groupId = new URLSearchParams(location.search).get('gid') || '';
      if (!groupId) {
        showMsg('請在群組打「訂單」，從機器人貼出的連結開啟本表單', true);
        return;
      }

      // 送出後要以本人名義在群組發訊息，沒授權就先跳授權畫面（授權完會自動回到表單），不要等填完才失敗
      // 電腦版 LINE 不支援跳授權畫面（SkipChannelVerificationScreen is unavailable），失敗就略過、照常填表
      try {
        const perm = await liff.permission.query('chat_message.write');
        if (perm.state === 'prompt') {
          showMsg('請先按「許可」，允許傳送訊息到聊天室…');
          await liff.permission.requestAll();
          return;
        }
      } catch (e) {
        console.warn('略過授權檢查：' + e.message);
        showMsg('');
      }

      const profile = await liff.getProfile();
      $('who').textContent = '登記人：' + profile.displayName;
      $('btn').disabled = false;
      loadInit();
    }

    $('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      $('btn').disabled = true;
      // 表單開太久（超過憑證有效時間）：還沒送出任何東西，請使用者重新整理
      if (idTokenExpiresSoon(1)) {
        showMsg('表單開太久，登入已過期。請按右上角 ⋮ →「重新整理」後再填一次（這筆還沒送出）', true);
        $('btn').disabled = false;
        return;
      }
      const customer = $('customer').value.trim();
      if (isSunday($('shipDate').value)) {
        showMsg('週日不出貨，請選其他出貨日期', true);
        $('btn').disabled = false;
        return;
      }
      const shipDate = $('shipDate').value.replace(/-/g, '/'); // Ragic 日期格式 yyyy/MM/dd
      const rows = readRows();

      let photos, files;
      try {
        if ($('photos').files.length || $('files').files.length) showMsg('處理照片／檔案中…');
        photos = await readPhotos();
        files = await readFiles();
      } catch (e) {
        showMsg('檔案有問題：' + e.message, true);
        $('btn').disabled = false;
        return;
      }

      showMsg('送出中…（偶爾需要 10–30 秒，請勿關閉）');
      const ctrl = new AbortController();
      // 有附件時上傳較久，等候時間拉長
      const timer = setTimeout(() => ctrl.abort(), photos.length || files.length ? 120000 : 45000);
      // GAS 偶爾處理完了、回應卻傳不回來（Failed to fetch）。同一個 submitId 重送不會重複建立，
      // 所以網路錯誤時自動重試，最多 2 次，重試會拿到第一次的結果
      async function postWithRetry(body) {
        for (let attempt = 0; ; attempt++) {
          try {
            return await fetch(GAS_URL, {
              method: 'POST',
              signal: ctrl.signal,
              headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 用 text/plain 避免 CORS preflight（GAS 不支援 OPTIONS）
              body: body,
            });
          } catch (e) {
            if (e.name === 'AbortError' || attempt >= 2) throw e;
            showMsg('網路不穩，自動重試中…（' + (attempt + 1) + '/2）');
            await new Promise((r) => setTimeout(r, 2000));
          }
        }
      }

      try {
        const res = await postWithRetry(JSON.stringify({
            type: 'liff_submit',
            submitId: submitId,
            idToken: liff.getIDToken(),   // 後端用來驗證身分，不信任前端傳來的名字
            groupId: groupId,
            customer: customer,
            shipDate: shipDate,
            shipMethod: $('shipMethod').value,
            payMethod: $('payMethod').value,
            invoice: $('invoice').value,
            amount: $('amount').value,
            rows: rows,
            tags: checkedTags().map((c) => c.value),
            photos: photos,
            files: files,
            item: $('item').value.trim(),
        }));
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '未知錯誤');
        // 只有真正寫進 Ragic 才會有 ragicId；只看 ok:true 不算數
        if (typeof data.ragicId !== 'number') throw new Error('伺服器回應異常');

        // 以填表人名義在群組發一句話，機器人收到後用 Reply（免費）回「登記成功」
        try {
          await liff.sendMessages([{
            type: 'text',
            text: '📝 我登記了' + (customer ? '（' + customer + '）' : '') + '\n'
              + '出貨日期：' + shipDate + '\n'
              + rows.map((r) => '・' + r.grade + '　' + r.pack + ' × ' + r.qty).join('\n')
              + '\n（登記編號 #' + data.ragicId + '）',
          }]);
        } catch (e) {
          // 電腦版 LINE 不能代發訊息 → 把「登記編號 #N」複製好，使用者到群組貼上送出，機器人一樣會回（免費）
          showCopyFallback('登記編號 #' + data.ragicId);
          return;
        }

        if (data.uploadError) {
          // 訂單已成立，只是附件沒上去；不要自動關閉，讓使用者看到提醒
          showMsg('✅ 已登記成功（請勿重新送出），但照片／檔案上傳失敗，請到 Ragic 該筆訂單補上傳', true);
          return;
        }
        showMsg('✅ 已送出！');
        setTimeout(() => liff.closeWindow(), 1200);
      } catch (e) {
        // 逾時 ≠ 失敗：可能其實已寫入。再按送出也安全（同一個 submitId 不會重複建立）
        // AbortError＝逾時；TypeError＝網路中斷（Failed to fetch）。兩種都可能其實已寫入
        const msg = e.name === 'AbortError' || e.name === 'TypeError'
          ? '連線不穩，可能已經登記成功。請直接再按一次「送出」確認（不會重複登記）'
          : '送出失敗：' + e.message;
        showMsg(msg, true);
        $('btn').disabled = false;
      } finally {
        clearTimeout(timer);
      }
    });

    main().catch((e) => showMsg('初始化失敗：' + e.message, true));
  </script>
</body>
</html>
