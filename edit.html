<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>改單申請</title>
  <style>
    :root { --main: #06c755; --text: #222; --muted: #777; --bg: #f5f5f5; --line: #ddd; --warn: #b45309; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font-family: -apple-system, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); }
    .card { background: #fff; border-radius: 12px; padding: 20px; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .who { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    label, .label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input, textarea, select { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; color: var(--text); }
    textarea { min-height: 70px; }
    .row { display: grid; grid-template-columns: 1fr 90px 40px; grid-template-areas: "grade qty del" "pack pack pack";
           gap: 8px; padding: 10px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 10px; }
    .row .grade { grid-area: grade; }
    .row .pack { grid-area: pack; }
    .row input { grid-area: qty; text-align: center; }
    .del { grid-area: del; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #c00; font-size: 18px; }
    .add { width: 100%; padding: 10px; border: 1px dashed var(--main); border-radius: 8px; background: #fff; color: var(--main); font-size: 16px; }
    .cancelbox { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 12px; border: 1px solid #f3c6c6; border-radius: 10px; background: #fff7f7; font-weight: 600; color: #b91c1c; }
    .cancelbox input { width: 22px; height: 22px; margin: 0; }
    .hint { font-size: 14px; color: var(--muted); margin-top: 6px; }
    .pending { font-size: 14px; color: var(--warn); margin-top: 6px; }
    .submit { width: 100%; margin-top: 24px; padding: 14px; font-size: 17px; border: 0; border-radius: 8px; background: var(--main); color: #fff; }
    .submit:disabled { background: #aaa; }
    .msg { margin-top: 14px; text-align: center; white-space: pre-line; }
    .err { color: #d00; }
    .hidden { display: none; }
      ::placeholder { color: #aaa; opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>改單申請</h1>
    <div class="who" id="who">載入中…</div>

    <label for="pickDate">訂單的出貨日期</label>
    <input type="date" id="pickDate">

    <label for="order">要改哪張訂單</label>
    <select id="order" disabled><option value="">載入訂單中…</option></select>
    <div class="hint">只會列出你自己登記、還沒取消、這天出貨的訂單</div>
    <div class="pending" id="pending"></div>

    <form id="form" class="hidden">
      <label class="cancelbox"><input type="checkbox" id="cancel"> 取消整張訂單</label>

      <div id="editArea">
        <div class="hint">直接改成你要的樣子，沒改的不用動</div>
        <label for="shipDate">出貨日期（週日不出貨）</label>
        <input type="date" id="shipDate">

        <label for="shipMethod">出貨方式</label>
        <select id="shipMethod"></select>

        <label for="dispatchDate">派車日期（親送才用）</label>
        <div style="display:flex;gap:8px">
          <input type="date" id="dispatchDate" style="flex:1">
          <button type="button" id="clearDispatch" style="flex:none;padding:0 12px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:15px">清空</button>
        </div>
        <div class="hint">清空＝取消派車，這張單會回到「派車」清單</div>

        <label for="customer">客戶</label>
        <input id="customer" placeholder="例：墨達燒肉">

        <div class="label">出貨明細</div>
        <div id="rows"></div>
        <button type="button" class="add" id="addRow">＋ 新增一列</button>

        <label for="payMethod">結帳方式</label>
        <select id="payMethod"></select>

        <label for="invoice">發票方式</label>
        <select id="invoice"></select>
        <div id="triBox" style="display:none">
          <label for="invTitle">三聯抬頭（必填）</label>
          <input id="invTitle" placeholder="例：墨達燒肉有限公司">
          <label for="invTax">三聯統編（必填，8 碼數字）</label>
          <input id="invTax" inputmode="numeric" maxlength="8" placeholder="例：12345678">
        </div>

        <label for="item">備註</label>
        <textarea id="item" placeholder="選填，例：送達時先打電話"></textarea>

        <label for="amount">匯款金額</label>
        <input type="number" id="amount" inputmode="numeric" min="0" step="1" placeholder="選填，例：1530">
      </div>

      <label for="reason">修改原因（必填）</label>
      <textarea id="reason" required placeholder="例：客戶追加、延後出貨、少打一個零"></textarea>

      <button type="submit" class="submit" id="btn">送出申請</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="progress.js"></script>
  <script src="quick.js"></script>
  <script>
    const LIFF_ID = '2011822642-ulMcTzMV';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxspHUq2ruPSPPXkJXkQ_ZsnnD9CkkooMnOlRtZFAT8z8GVLd2pshOhephVznND1s3YZQ/exec';

    const $ = (id) => document.getElementById(id);
    let groupId = '';
    let ORDERS = [];
    let OPTS = { grades: [], packs: [], shipMethod: [], payMethod: [], invoice: [] };
    const submitId = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2));

    function showMsg(text, isErr) {
      $('msg').textContent = text;
      $('msg').className = 'msg' + (isErr ? ' err' : '');
    }

    // 下拉：原本的值不在選項裡（例如舊名稱）也先放進去，免得被默默清掉
    function fillSelect(s, placeholder, options, value) {
      s.innerHTML = '';
      s.append(new Option(placeholder, ''));
      const list = options.slice();
      if (value && list.indexOf(value) < 0) list.push(value);
      list.forEach((o) => s.append(new Option(o, o)));
      s.value = value || '';
    }

    function addRow(r) {
      r = r || { rowId: '', grade: '', pack: '', qty: '' };
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.rowId = r.rowId || '';
      const grade = document.createElement('select'); grade.className = 'grade'; grade.required = true;
      fillSelect(grade, '等級', OPTS.orderGrades || OPTS.grades, r.grade); // 等級＝庫存品項
      const pack = document.createElement('select'); pack.className = 'pack'; pack.required = true;
      fillSelect(pack, r.pack ? '包裝方式' : '包裝方式（原本空白，請選）', OPTS.packs, r.pack);
      const qty = document.createElement('input');
      qty.type = 'number'; qty.inputMode = 'numeric'; qty.min = '1'; qty.step = '1'; qty.required = true; qty.placeholder = '例：5';
      qty.value = r.qty || '';
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'del'; del.textContent = '✕';
      del.onclick = () => { if ($('rows').children.length > 1) row.remove(); };
      row.append(grade, qty, del, pack);
      $('rows').append(row);
    }

    function readRows() {
      return [...$('rows').children].map((row) => ({
        rowId: row.dataset.rowId,
        grade: row.querySelector('.grade').value,
        pack: row.querySelector('.pack').value,
        qty: row.querySelector('input').value,
      }));
    }

    // 選了訂單 → 把原本內容帶進表單
    function loadOrder(o) {
      $('pending').textContent = o.pending ? '⚠️ 這張訂單已經有申請在處理中（' + o.pending + '），請等後勤處理完再申請' : '';
      $('form').classList.toggle('hidden', !!o.pending);
      if (o.pending) return;
      $('cancel').checked = false;
      $('editArea').classList.remove('hidden');
      $('shipDate').value = (o.fields.SHIP_DATE || '').replace(/\//g, '-');
      fillSelect($('shipMethod'), '（未選）', OPTS.shipMethod, o.fields.SHIP_METHOD);
      $('dispatchDate').value = (o.fields.DISPATCH_DATE || '').replace(/\//g, '-');
      $('customer').value = o.fields.CUSTOMER || '';
      $('rows').innerHTML = '';
      (o.rows.length ? o.rows : [null]).forEach(addRow);
      fillSelect($('payMethod'), '（未選）', OPTS.payMethod, o.fields.PAY_METHOD);
      fillSelect($('invoice'), '（未選）', OPTS.invoice, o.fields.INVOICE);
      $('invTitle').value = o.fields.INV_TITLE || '';
      // Ragic 統編是數字欄位，0 開頭會被吃掉 → 補回 8 碼
      $('invTax').value = o.fields.INV_TAX ? String(o.fields.INV_TAX).padStart(8, '0') : '';
      showTri();
      $('item').value = o.fields.ITEM || '';
      $('amount').value = o.fields.AMOUNT || '';
      $('reason').value = '';
      showMsg('');
    }

    $('order').onchange = () => {
      const o = ORDERS.find((x) => String(x.id) === $('order').value);
      if (o) loadOrder(o); else $('form').classList.add('hidden');
    };
    $('cancel').onchange = () => $('editArea').classList.toggle('hidden', $('cancel').checked);

    // 不出貨的日子（週日＋停止出貨日期清單）：改成這些日子就跳回原日期並提醒（原本就是的舊訂單，沒改日期不擋）
    function noShip(v) {
      if (!v) return '';
      if (v < new Date().toLocaleDateString('sv-SE')) return '出貨日期不能改成過去的日期';
      const p = v.split('-').map(Number);
      if (new Date(p[0], p[1] - 1, p[2]).getDay() === 0) return '週日不出貨，請選其他出貨日期';
      const slash = v.replace(/-/g, '/');
      if ((OPTS.blockedDates || []).indexOf(slash) >= 0) {
        const why = (OPTS.blockedReasons || {})[slash];
        return v.slice(5).replace('-', '/') + (why ? ' ' + why : '') + ' 停止出貨，請選其他出貨日期';
      }
      return '';
    }
    // 週六、國定假日、補假：可以出貨，但送出前要再確認。回傳「10/10（六）國慶日」，平日回傳空字串
    function holidayWarn(v) {
      if (!v) return '';
      const p = v.split('-').map(Number);
      const wd = new Date(p[0], p[1] - 1, p[2]).getDay();
      const label = v.slice(5).replace('-', '/') + '（' + '日一二三四五六'[wd] + '）';
      const why = (OPTS.warnDates || {})[v.replace(/-/g, '/')];
      if (why) return label + ' ' + why;
      return wd === 6 ? label + ' 週六' : '';
    }
    $('shipDate').addEventListener('change', () => {
      const o = ORDERS.find((x) => String(x.id) === $('order').value);
      const orig = o ? (o.fields.SHIP_DATE || '').replace(/\//g, '-') : '';
      const why = $('shipDate').value !== orig ? noShip($('shipDate').value) : '';
      if (why) {
        $('shipDate').value = orig;
        showMsg(why, true);
      } else {
        showMsg('');
      }
    });
    $('addRow').onclick = () => addRow();
    // 發票選三聯 → 顯示抬頭、統編（必填）
    function showTri() { $('triBox').style.display = $('invoice').value === '三聯' ? '' : 'none'; }
    $('invoice').addEventListener('change', showTri);
    $('clearDispatch').onclick = () => { $('dispatchDate').value = ''; };

    let READY = false; // 拿到 GAS 最新的訂單了沒（之前畫面上可能是手機存的舊資料）

    // 畫訂單下拉；已經選好的單如果還在就保留
    function showOrders(data) {
      ORDERS = data.orders;
      OPTS = data.options || OPTS;
      const sel = $('order');
      const keep = sel.value;
      sel.innerHTML = '';
      if (!ORDERS.length) {
        sel.append(new Option('這天沒有你可以修改的訂單', ''));
        sel.disabled = true;
        return;
      }
      sel.append(new Option('請選擇訂單', ''));
      ORDERS.forEach((o) => {
        // 日期已經選了，改顯示出貨方式：同一天同客戶的單才分得出來
        sel.append(new Option(o.no + '｜' + (o.fields.CUSTOMER || '—') + '｜' + (o.fields.SHIP_METHOD || '未選出貨方式') + (o.pending ? '｜申請中' : ''), String(o.id)));
      });
      if (keep && ORDERS.some((o) => String(o.id) === keep)) sel.value = keep;
      sel.disabled = false;
    }

    // 先顯示手機上存的這天訂單（有的話），再跟 GAS 拿最新的；有變才換上
    async function loadOrders() {
      const date = $('pickDate').value.replace(/-/g, '/');
      const name = 'orders_' + date;
      const sel = $('order');
      READY = false;
      $('form').classList.add('hidden');
      $('pending').textContent = '';
      sel.value = '';
      const cached = QuickCache.get(name);
      if (cached) showOrders(cached);
      else { sel.disabled = true; sel.innerHTML = '<option value="">載入訂單中…</option>'; }
      // GAS 偶爾回 Google 的錯誤網頁（不是 JSON）：自動再試 2 次
      let data;
      for (let attempt = 0; ; attempt++) {
        try {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ type: 'my_orders', idToken: liff.getIDToken(), groupId: groupId, date: date }),
          });
          const text = await res.text();
          data = JSON.parse(text);
          break;
        } catch (e) {
          if (attempt >= 2) throw new Error('伺服器忙碌，請稍後關掉表單重開（' + e.message.slice(0, 40) + '）');
          showMsg('連線不穩，自動重試中…（' + (attempt + 1) + '/2）');
          await new Promise((r) => setTimeout(r, 2000));
        }
      }
      if (!data.ok) throw new Error(data.error);
      if ($('pickDate').value.replace(/-/g, '/') !== date) return; // 等的時候又換了日期
      READY = true;
      const before = (cached && cached.orders || []).find((o) => String(o.id) === sel.value);
      if (QuickCache.set(name, { orders: data.orders, options: data.options })) {
        const after = data.orders.find((o) => String(o.id) === sel.value);
        showOrders(data);
        // 已經選了一張在改，剛好那張被別人動過 → 請他重選，免得照舊內容改
        if (before && JSON.stringify(before) !== JSON.stringify(after)) {
          sel.value = '';
          $('form').classList.add('hidden');
          showMsg('⚠️ 你選的訂單剛有變動，請重新選一次', true);
        }
      }
    }

    // ---- 電腦版：複製改單編號 ----
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.append(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove(); return ok;
      }
    }

    async function showCopyFallback(text) {
      const head = '✅ 已送出申請（請勿重新送出）\n群組通知沒發出，電腦端請在群組貼上：' + text;
      const done = () => {
        showMsg(head + '\n（已自動複製，到群組按 Ctrl + V、Enter 即可）\n貼好後可以自己關掉這個視窗');
      };
      if (await copyText(text)) return done();
      showMsg(head);
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'submit'; btn.textContent = '📋 複製「' + text + '」';
      btn.onclick = async () => { if (await copyText(text)) { btn.remove(); done(); } else btn.textContent = '複製失敗，請手動在群組輸入：' + text; };
      $('msg').after(btn);
    }

    function idTokenExpiresSoon(minutes) {
      const t = liff.getDecodedIDToken();
      return !t || !t.exp || t.exp * 1000 < Date.now() + minutes * 60000;
    }

    async function main() {
      // 日期先定好（今天），並先顯示手機上存的這天訂單（不用等登入和 GAS）
      const today = new Date().toLocaleDateString('sv-SE');
      $('pickDate').value = today;
      $('pickDate').min = today; // 只能改今天或之後出貨的訂單
      const cached = QuickCache.get('orders_' + today.replace(/-/g, '/'));
      if (cached) showOrders(cached);
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

      let relogged = false;
      try { relogged = sessionStorage.getItem('relogin') === '1'; } catch (e) {}
      if (idTokenExpiresSoon(30) && !relogged) {
        try { sessionStorage.setItem('relogin', '1'); } catch (e) {}
        showMsg('登入憑證更新中…');
        liff.logout();
        liff.login({ redirectUri: location.href });
        return;
      }
      try { sessionStorage.removeItem('relogin'); } catch (e) {}

      groupId = new URLSearchParams(location.search).get('gid') || '';
      if (!groupId) { showMsg('請從群組內機器人貼出的「改單申請連結」開啟本表單', true); return; }

      try {
        const perm = await liff.permission.query('chat_message.write');
        if (perm.state === 'prompt') {
          showMsg('請先按「許可」，允許傳送訊息到聊天室…');
          await liff.permission.requestAll();
          return;
        }
      } catch (e) { showMsg(''); }

      const profile = await liff.getProfile();
      $('who').textContent = '申請人：' + profile.displayName;
      $('pickDate').addEventListener('change', () => {
        if (!$('pickDate').value) return;
        if ($('pickDate').value < today) { $('pickDate').value = today; showMsg('只能改今天或之後出貨的訂單', true); }
        loadOrders().catch((e) => showMsg('讀取失敗：' + e.message, true));
      });
      await loadOrders();
    }

    $('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      if (idTokenExpiresSoon(1)) {
        showMsg('表單開太久，登入已過期。請按右上角 ⋮ →「重新整理」後再填一次（這筆還沒送出）', true);
        return;
      }
      if (!READY) { showMsg('訂單資料更新中，請等一秒再按', true); return; }
      const o = ORDERS.find((x) => String(x.id) === $('order').value);
      if (!o) return;
      const cancel = $('cancel').checked;
      if (cancel && !confirm('確定要申請「取消整張訂單 ' + o.no + '」嗎？')) return;
      // 改到週六／國定假日／補假：再確認一次（沒改日期不問）
      const warn = !cancel && $('shipDate').value !== (o.fields.SHIP_DATE || '').replace(/\//g, '-') ? holidayWarn($('shipDate').value) : '';
      if (warn && !confirm('出貨日 ' + warn + '\n\n你要跟林大場長確認喔!! 出包算你的...\n\n確定要送出嗎？')) return;
      if (!cancel && $('invoice').value === '三聯' && (!$('invTitle').value.trim() || !/^\d{8}$/.test($('invTax').value.trim()))) {
        showMsg(!$('invTitle').value.trim() ? '發票選三聯，請填三聯抬頭' : '三聯統編要 8 碼數字', true);
        return;
      }
      $('btn').disabled = true;
      showMsg('送出中…（偶爾需要 10–30 秒，請勿關閉）');
      const prog = SubmitProgress($('btn'), 'edit'); // 送出按鈕變預估進度條

      const body = JSON.stringify({
        type: 'change_submit', submitId: submitId, idToken: liff.getIDToken(), groupId: groupId,
        orderId: o.id, cancel: cancel, reason: $('reason').value.trim(),
        fields: cancel ? {} : {
          SHIP_DATE: $('shipDate').value.replace(/-/g, '/'),
          SHIP_METHOD: $('shipMethod').value,
          DISPATCH_DATE: $('dispatchDate').value.replace(/-/g, '/'),
          CUSTOMER: $('customer').value.trim(),
          PAY_METHOD: $('payMethod').value,
          INVOICE: $('invoice').value,
          INV_TITLE: $('invoice').value === '三聯' ? $('invTitle').value.trim() : '',
          INV_TAX: $('invoice').value === '三聯' ? $('invTax').value.trim() : '',
          ITEM: $('item').value.trim(),
          AMOUNT: $('amount').value,
        },
        rows: cancel ? [] : readRows(),
      });
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 45000);
      async function postWithRetry() {
        for (let attempt = 0; ; attempt++) {
          try {
            return await fetch(GAS_URL, { method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body });
          } catch (e) {
            if (e.name === 'AbortError' || attempt >= 2) throw e;
            showMsg('網路不穩，自動重試中…（' + (attempt + 1) + '/2）');
            await new Promise((r) => setTimeout(r, 2000));
          }
        }
      }

      try {
        const res = await postWithRetry();
        prog.received();
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '未知錯誤');
        const code = '改單編號 #' + data.crId;
        try {
          await liff.sendMessages([{ type: 'text', text: '✏️ 我申請' + (cancel ? '取消' : '修改') + '訂單 ' + data.orderNo + '\n（' + code + '）' }]);
        } catch (e) {
          prog.finish('✅ 已送出');
          showCopyFallback(code);
          return;
        }
        showMsg('✅ 已送出申請！等後勤核准後會自動套用');
        prog.finish();
        setTimeout(() => liff.closeWindow(), 1500);
      } catch (e) {
        const msg = e.name === 'AbortError' || e.name === 'TypeError'
          ? '連線不穩，可能已經送出。請直接再按一次「送出申請」確認（不會重複申請）'
          : '送出失敗：' + e.message;
        showMsg(msg, true);
        prog.reset();
        $('btn').disabled = false;
      } finally {
        clearTimeout(timer);
      }
    });

    main().catch((e) => showMsg('初始化失敗：' + e.message, true));
  </script>
</body>
</html>
